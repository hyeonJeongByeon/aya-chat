<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Clover — Week 4</title>
<link rel="stylesheet" href="assets/chat.css">
</head>
<body>
<button class="setup-gear" id="setupGear" title="Researcher setup">⚙️</button>

<div class="iphone">
  <div class="screen">
    <div class="dynamic-island"></div>

    <div class="status-bar">
      <div class="status-time" id="statusTime">9:41</div>
      <div class="status-icons" aria-hidden="true">
        <svg viewBox="0 0 17 12"><rect x="0" y="5" width="3" height="7" rx="0.5"/><rect x="4.5" y="3" width="3" height="9" rx="0.5"/><rect x="9" y="1" width="3" height="11" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" opacity="0.3"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 9.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="#000"/><path d="M3.5 6.5C4.9 5.1 6.4 4.5 8 4.5s3.1.6 4.5 2" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/><path d="M1 4C3 2 5.4 1 8 1s5 1 7 3" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 25 12" width="25" height="12">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#000" stroke-width="1" fill="none"/>
          <rect x="22" y="4" width="2.5" height="4" rx="1" fill="#000" opacity="0.4"/>
          <rect x="1.5" y="1.5" width="18" height="9" rx="2" fill="#000"/>
        </svg>
      </div>
    </div>

    <div class="nav-bar">
      <div class="nav-back" aria-hidden="true">
        <svg viewBox="0 0 12 20"><polyline points="10,2 2,10 10,18"/></svg>
        <span>77</span>
      </div>
      <div class="nav-contact">
        <img class="nav-avatar" src="assets/clover.png" alt="Clover">
        <div class="nav-name">
          Clover
          <svg viewBox="0 0 10 10"><polyline points="2,3 5,7 8,3"/></svg>
        </div>
      </div>
      <div class="nav-video" aria-hidden="true">
        <svg viewBox="0 0 28 20"><path d="M2 3h16a2 2 0 012 2v10a2 2 0 01-2 2H2a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M20 8l7-4v12l-7-4V8z"/></svg>
      </div>
    </div>

    <div class="messages-area" id="messagesArea" aria-live="polite" aria-label="Conversation with Clover">
      <div class="date-sep" id="dateSep">Today 9:41 AM</div>
    </div>

    <div class="chips-bar" id="chipsBar"></div>

    <form class="input-bar" id="chatForm">
      <button class="input-app-btn" type="button" aria-label="Apps" tabindex="-1">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      </button>
      <div class="input-wrap">
        <textarea class="input-field" id="inputField" placeholder="iMessage" rows="1" autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">
          <svg viewBox="0 0 16 16"><path d="M8 13.5V3M3.5 7.5L8 3l4.5 4.5"/></svg>
        </button>
      </div>
    </form>
  </div>
</div>

<div class="setup-overlay" id="setupOverlay">
  <div class="setup-panel">
    <h2>Researcher setup — <span id="weekBadge">Week 4</span></h2>
    <p class="sub">Participants never need this panel. Paste a fresh Vertex AI access token before each interview (tokens expire after ~1 hour):<br>
    <code>gcloud auth login</code> with your Seattle Children's account, then <code>gcloud auth print-access-token</code></p>

    <label for="cfgToken">Access token</label>
    <textarea id="cfgToken" placeholder="ya29...."></textarea>

    <div class="setup-row">
      <div>
        <label for="cfgProject">GCP project ID</label>
        <input type="text" id="cfgProject" placeholder="dev-cancer-med-health-chatbot">
      </div>
      <div>
        <label for="cfgLocation">Location</label>
        <input type="text" id="cfgLocation" value="us-central1">
      </div>
    </div>

    <div class="setup-row">
      <div>
        <label for="cfgModel">Model</label>
        <input type="text" id="cfgModel" value="gemini-2.5-flash">
      </div>
      <div>
        <label for="cfgSeed">Participant seed</label>
        <input type="text" id="cfgSeed" placeholder="auto">
      </div>
    </div>

    <div class="setup-check">
      <input type="checkbox" id="cfgOffline">
      <label for="cfgOffline" style="margin:0">Offline mode (scripted fallback replies, no Gemini)</label>
    </div>

    <div class="setup-actions">
      <button class="primary" id="cfgSave">Save</button>
      <button id="cfgTest">Test Gemini</button>
      <button id="cfgDownload">Download transcript</button>
      <button class="danger" id="cfgResetWeek">Restart week</button>
      <button class="danger" id="cfgResetAll">New participant</button>
      <button id="cfgClose">Close</button>
    </div>
    <div class="setup-status" id="setupStatus"></div>
  </div>
</div>

<script>window.CLOVER_WEEK = 4;</script>
<script src="assets/content.js"></script>
<script src="assets/engine.js"></script>
</body>
</html>
